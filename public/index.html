<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTMS — Industrial Practical Training Management System</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="authScreen" class="auth-wrap" style="display:none;">
  <div class="auth-card">
    <div class="brand" style="border:none; margin-bottom:14px;">
      <span class="mark">IPTMS · SECURE LOGIN</span>
      <h1>Industrial Practical Training MS</h1>
    </div>
    <div class="tabs">
      <button id="tabLogin" class="tab active">Ingia (Login)</button>
      <button id="tabRegister" class="tab">Jisajili (Register)</button>
    </div>
    <div id="loginPane"></div>
    <div id="registerPane" style="display:none;"></div>
    <div id="authMsg" class="auth-msg"></div>
  </div>
</div>

<div id="app" style="display:none;">
  <aside class="sidebar">
    <div class="brand">
      <span class="mark">IPTMS · SECURE</span>
      <h1>Industrial Practical Training MS</h1>
    </div>
    <div class="whoami" id="whoami"></div>
    <nav id="navMenu"></nav>
    <div class="sidebar-foot">
      Data flow: Superadmin → Head of Faculty → Industrial Supervisor → Student → University Supervisor.<br>
      Saini za kila mtumiaji zimehifadhiwa salama kwenye database tangu usajili.
    </div>
    <button class="btn btn-ghost" id="logoutBtn" style="margin-top:14px;">Toka (Logout)</button>
  </aside>
  <main id="mainView"><div class="empty">Inapakia…</div></main>
</div>

<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
